plugins {
    id 'java'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}

group = 'com.priorityqueue'
version = '1.0.0'

repositories {
    mavenCentral()
    maven { url = 'https://oss.sonatype.org/content/repositories/snapshots' }
    maven { url = 'https://repo.papermc.io/repository/maven-public/' }
    maven { url = 'https://jitpack.io' }
}

dependencies {
    // BungeeCord API
    compileOnly 'net.md-5:bungeecord-api:1.20-R0.2'

    // Velocity API
    compileOnly 'com.velocitypowered:velocity-api:3.3.0-SNAPSHOT'
    annotationProcessor 'com.velocitypowered:velocity-api:3.3.0-SNAPSHOT'

    // Adventure API (for Velocity)
    implementation 'net.kyori:adventure-text-minimessage:4.14.0'
    implementation 'net.kyori:adventure-platform-bungeecord:4.3.2'

    // Configuration
    implementation 'org.spongepowered:configurate-yaml:4.1.2'

    // Database (for persistent storage)
    implementation 'com.zaxxer:HikariCP:5.0.1'
    implementation 'org.xerial:sqlite-jdbc:3.42.0.0'

    // Lombok
    compileOnly 'org.projectlombok:lombok:1.18.30'
    annotationProcessor 'org.projectlombok:lombok:1.18.30'
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

shadowJar {
    archiveFileName = "PriorityQueue-${project.version}.jar"
    minimize()
    relocate 'net.kyori', 'com.priorityqueue.lib.kyori'
    relocate 'org.spongepowered.configurate', 'com.priorityqueue.lib.configurate'
    relocate 'com.zaxxer', 'com.priorityqueue.lib.hikari'
}

tasks.build {
    dependsOn shadowJar
}
